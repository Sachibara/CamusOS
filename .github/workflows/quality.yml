name: CamusOS quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Verify output assets
        run: test -f dist/index.html && test -d dist/assets && test -f dist/favicon.svg
